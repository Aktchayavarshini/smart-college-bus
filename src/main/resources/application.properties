# ===================================================================
# SMART COLLEGE BUS ALLOCATION SYSTEM - CONFIGURATION
# ===================================================================
spring.application.name=Smart College Bus Allocation System
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# -------------------------------------------------------------------
# MySQL Database Connection Settings
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/CollegeBusDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Hibernate JPA Settings (Auto-schema creation and update)
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Dialect is auto-detected from active datasource driver

# -------------------------------------------------------------------
# Thymeleaf Template Engine Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# Static Web Resources Handling
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/

# -------------------------------------------------------------------
# Session and Security Configuration
# -------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.error.whitelabel.enabled=false

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.com.collegebus=DEBUG
logging.level.org.springframework.security=INFO
