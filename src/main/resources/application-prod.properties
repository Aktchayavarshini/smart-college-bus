# Production profile: configure all values through the hosting provider's environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is provisioned through database/CollegeBusDB.sql; Hibernate must not mutate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false
spring.thymeleaf.cache=true

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
server.error.whitelabel.enabled=false

app.frontend.origin=${FRONTEND_ORIGIN}

logging.level.com.collegebus=INFO
logging.level.org.springframework.security=WARN
# Reverse-proxy and graceful-shutdown behavior for container hosting.
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Keep server-side timestamps consistent while campus business dates use Asia/Kolkata.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=Asia/Kolkata

# Do not disclose internal exception details to clients.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
# One-time administrator bootstrap; disabled unless explicitly enabled for first deployment.
app.admin.bootstrap-enabled=${ADMIN_BOOTSTRAP_ENABLED:false}

# Evaluator accounts are opt-in and require explicit secrets in the hosting environment.
app.demo-accounts.enabled=${DEMO_ACCOUNTS_ENABLED:false}
app.demo-accounts.admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo-accounts.student-password=${DEMO_STUDENT_PASSWORD:}
app.demo-accounts.teacher-password=${DEMO_TEACHER_PASSWORD:}
