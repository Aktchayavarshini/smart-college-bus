<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Modify Booking')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="text-center mb-4">
                    <span class="badge bg-warning text-dark fw-bold px-3 py-1 rounded-pill">MODIFICATION</span>
                    <h2 class="fw-bold text-primary mt-1">Modify Your Booking</h2>
                    <p class="text-muted">Safe modification: Your existing seat remains reserved until the new booking is confirmed.</p>
                </div>

                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="custom-card p-4 p-md-5 shadow-lg">
                    <!-- Current Booking Summary -->
                    <div class="p-3 bg-light rounded-3 border mb-4">
                        <div class="fw-bold text-secondary small text-uppercase mb-2">Existing Confirmed Booking #<span th:text="${currentBooking.bookingId}">1</span></div>
                        <div class="row g-2 small">
                            <div class="col-6"><strong>Bus:</strong> <span th:text="${currentBooking.trip.bus.busNumber}">BUS-101</span></div>
                            <div class="col-6"><strong>Date:</strong> <span th:text="${currentBooking.trip.travelDate}">2026-11-03</span></div>
                            <div class="col-6"><strong>Departure:</strong> <span th:text="${currentBooking.trip.departureTime}">07:00 AM</span></div>
                            <div class="col-6"><strong>Pickup:</strong> <span th:text="${currentBooking.pickupStop.stopName}">Pallavaram</span></div>
                        </div>
                    </div>

                    <form th:action="@{/booking/modify/{id}(id=${currentBooking.bookingId})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="tripId" th:value="${currentBooking.trip.tripId}"/>

                        <div class="mb-3">
                            <label class="form-label fw-bold small">New Pickup Stop</label>
                            <select name="pickupStopId" class="form-select" required>
                                <option th:each="s : ${stops}" th:value="${s.stopId}" th:text="${s.stopName} + ' (' + ${s.area} + ')'"
                                        th:selected="${currentBooking.pickupStop.stopId == s.stopId}"></option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold small">New Dropoff Stop</label>
                            <select name="dropoffStopId" class="form-select" required>
                                <option th:each="s : ${stops}" th:value="${s.stopId}" th:text="${s.stopName} + ' (' + ${s.area} + ')'"
                                        th:selected="${currentBooking.dropoffStop.stopId == s.stopId}"></option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between gap-3">
                            <a th:href="@{/my-bookings}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                            <button type="submit" class="btn btn-warning fw-bold rounded-pill px-4">
                                <i class="fas fa-check me-1"></i> Update Booking Safely
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/aadhi-widget :: aadhiWidget}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
