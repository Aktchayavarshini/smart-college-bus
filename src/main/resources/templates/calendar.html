<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Monthly Travel Calendar')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="py-5">
    <div class="container">
        <div class="text-center mb-4">
            <span class="badge bg-primary-subtle text-primary fw-bold px-3 py-1 rounded-pill">STEP 1 OF 3</span>
            <h2 class="fw-bold text-primary mt-1">Select Travel Date</h2>
            <p class="text-muted">Choose your desired date from the monthly transport calendar to view available trips</p>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="custom-card p-4 shadow-sm">
                    <!-- Calendar Header Navigation -->
                    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                        <button id="calPrevBtn" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                            <i class="fas fa-chevron-left me-1"></i> Previous
                        </button>
                        <h4 id="calendarMonthYear" class="fw-bold text-primary mb-0">November 2026</h4>
                        <button id="calNextBtn" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                            Next <i class="fas fa-chevron-right ms-1"></i>
                        </button>
                    </div>

                    <!-- Weekdays Header -->
                    <div class="row text-center fw-bold text-secondary mb-2 small text-uppercase">
                        <div class="col">Sun</div>
                        <div class="col">Mon</div>
                        <div class="col">Tue</div>
                        <div class="col">Wed</div>
                        <div class="col">Thu</div>
                        <div class="col">Fri</div>
                        <div class="col">Sat</div>
                    </div>

                    <!-- Days Grid generated by main.js -->
                    <div id="calendarDaysGrid" class="d-grid" style="grid-template-columns: repeat(7, 1fr); gap: 4px;">
                        <!-- Rendered dynamically by JavaScript -->
                    </div>

                    <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center flex-wrap gap-2 text-muted small">
                        <div>
                            <span class="d-inline-block p-1 bg-white border border-primary rounded me-1"></span> Today
                            <span class="d-inline-block p-1 bg-light border rounded ms-3 me-1"></span> Past (Disabled)
                            <span class="d-inline-block p-1 bg-white border rounded ms-3 me-1"></span> Available for Booking
                        </div>
                        <div>
                            <i class="fas fa-info-circle text-primary me-1"></i> Click on any active date to proceed to Time Slot selection.
                        </div>
                    </div>
                </div>

                <!-- Direct Date Picker Alternative -->
                <div class="custom-card p-3 mt-4 bg-light text-center">
                    <form th:action="@{/select-slot}" method="get" class="row g-2 justify-content-center align-items-center">
                        <div class="col-auto">
                            <span class="fw-semibold small text-secondary">Or jump directly to a date:</span>
                        </div>
                        <div class="col-auto">
                            <input type="date" name="date" class="form-control form-control-sm" required th:min="${minDate}">
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-sm btn-primary-custom rounded-pill">
                                Continue <i class="fas fa-arrow-right ms-1"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/aadhi-widget :: aadhiWidget}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
