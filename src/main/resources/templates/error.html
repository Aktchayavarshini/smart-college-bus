<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Access Notification')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="py-5">
    <div class="container text-center py-5">
        <div class="custom-card p-5 mx-auto shadow-sm" style="max-width: 600px;">
            <div class="stat-icon bg-warning bg-opacity-10 text-warning mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2.5rem;">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3 class="fw-bold text-dark mb-2">Attention Required</h3>
            <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Access Restricted: You do not have permission to view this resource, or the requested page was not found.'}">
                Access Restricted: You do not have permission to view this resource.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a th:href="@{/}" class="btn btn-primary-custom rounded-pill px-4">
                    <i class="fas fa-home me-1"></i> Return Home
                </a>
                <a th:href="@{/talk-to-aadhi}" class="btn btn-outline-custom rounded-pill px-4">
                    <i class="fas fa-robot me-1"></i> Ask Aadhi
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
