name: Java CI

on:
  push:
    branches:
      - main
      - rebuild/production-upgrade
  pull_request:
    branches:
      - main
      - rebuild/production-upgrade

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: CollegeBusDB
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/CollegeBusDB?serverTimezone=UTC&sslMode=DISABLED
      DB_USERNAME: collegebus_app
      DB_PASSWORD: ci-only-pass
      FRONTEND_ORIGIN: https://example.test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Provision production schema in MySQL service
        run: docker run --rm -i --network host mysql:8.4 mysql --protocol=tcp -h127.0.0.1 -uroot -proot < database/CollegeBusDB-production-schema.sql
      - name: Verify all 13 production tables exist
        run: |
          docker run --rm --network host mysql:8.4 mysql --protocol=tcp -h127.0.0.1 -uroot -proot -N -e "SHOW TABLES FROM CollegeBusDB" | tee /tmp/collegebus-tables.txt
          test "$(wc -l < /tmp/collegebus-tables.txt)" -eq 13
      - name: Create least-privilege application database user
        run: docker run --rm --network host mysql:8.4 mysql --protocol=tcp -h127.0.0.1 -uroot -proot -e "CREATE USER 'collegebus_app'@'%' IDENTIFIED BY 'ci-only-pass'; GRANT SELECT, INSERT, UPDATE, DELETE ON CollegeBusDB.* TO 'collegebus_app'@'%';"
      - name: Run Maven tests
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Build production container image
        run: docker build --tag smart-college-bus:ci .
      - name: Smoke-test production container against MySQL
        run: |
          set -euo pipefail
          docker run -d --name smart-college-bus-ci --network host \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_URL="$DB_URL" \
            -e DB_USERNAME="$DB_USERNAME" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -e FRONTEND_ORIGIN="$FRONTEND_ORIGIN" \
            smart-college-bus:ci
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/stops > /tmp/stops.json; then
              cat /tmp/stops.json
              docker rm -f smart-college-bus-ci
              test "$(cat /tmp/stops.json)" = "[]"
              exit 0
            fi
            sleep 2
          done
          docker logs smart-college-bus-ci
          docker rm -f smart-college-bus-ci
          exit 1
